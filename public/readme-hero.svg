  <text x="70" y="282" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">built to convert.</text>
  <text x="70" y="325" fill="#C9E5DB" font-family="Arial, Helvetica, sans-serif" font-size="18">A multilingual website, package catalogue, enquiry engine,</text>
  <text x="70" y="351" fill="#C9E5DB" font-family="Arial, Helvetica, sans-serif" font-size="18">and operations dashboard for modern travel agencies.</text>

